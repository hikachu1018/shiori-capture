plugins { id 'com.android.application' }
android {
 namespace 'jp.shiori.capture'
 compileSdk 35
 defaultConfig {
  applicationId 'jp.shiori.capture'
  minSdk 30
  targetSdk 35
  versionCode 13
  versionName '0.5.3'
  // Build a smaller Galaxy APK with -PshioriAbi=arm64-v8a; omit for the universal APK.
  if (project.hasProperty('shioriAbi')) {
   ndk { abiFilters project.property('shioriAbi').toString() }
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
}
dependencies {
 implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
 implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
 testImplementation 'junit:junit:4.13.2'
}
